# dgdtools.yml -- the configuration of dgdtools (lint, format).
# Place it at your project root; every key is optional. It is found by
# walking up from each path the tools are given.
#
# This file shows every key, for someone who has the WHOLE lib. Somebody
# with only one directory of a lib needs one line instead:
#
#     profile: NAME
#
# in a dgdtools.yml in that directory (plus `lib_path:` when the
# directory's path does not show where in the lib it is). The profile is
# published by whoever has the whole lib (`dgdtools profile build`).
#
# examples/viking/dgdtools.yml is the configuration of a real mudlib.
#
# The top-level keys say what the project is. The two sections at the
# end, `format:` and `lint:`, are settings; a dgdtools.yml further down
# the tree that says `root: false` can adjust them for its directory
# (see the end of this file).

# extends: ../shared/dgdtools.yml   # start from another file: scalars and
#                                   # lists replace, maps merge

root: lib                    # filesystem directory that is the lib's "/"
                             # (default: this file's directory)

# profile: NAME              # work against a profile instead: NAME.profile
#                            # next to this file, in $DGDTOOLS_PROFILE_PATH or
#                            # in ~/.config/dgdtools/profiles; or a file path.
#                            # Real files on disk always win.
# lib_path: /usr/name        # the lib path of this directory, when it is
#                            # one part of a lib

exclude:                     # pruned from directory walks; a file named on
  - "**/old/**"              # the command line is always taken
  - "**/*.bak"

dialect:
  slash_slash: true          # // comments (DGD SLASHSLASH build flag)
  closures: false            # `function` keyword, &f(), (*f)() (CLOSURES flag)
  # typechecking: 2          # the driver's level; unknown = the rules that
  #                          # depend on it are silent
  # The kfuns the driver has beyond stock DGD's: those of the extension
  # modules it loads (`modules` in the driver's config file), each as a
  # prototype. The names of the parameters are optional. An editor shows
  # them like the driver's own.
  # kfuns:
  #   - "int *rusage()"
  #   - "string sha256(string text, varargs int rounds)"

# What the driver's config file says. Not needed with a profile or with
# profile_build.driver_config, which supply them; what is set here wins.
# include_dirs: ["/include"]
# include_file: "/include/std.h"       # force-included everywhere
# auto_objects: ["/kernel/lib/auto"]   # implicitly inherited by everything

# The function a new object is initialized by. The driver's config names
# the one the driver calls; a lib whose auto object receives that call and
# passes it on under another name (the kernel library: _F_create, then
# create) says here what its objects define.
# create: create

# What an object path without a leading slash is relative to. The driver
# hands every inherit and every call_other("path", ...) to the lib's
# driver object to resolve, so the lib decides:
#   root   "std/room" is /std/room, as in the driver's own functions
#          (the default)
#   file   the directory of the file that says it, as in the kernel
#          library
relative_object_paths: root

# The lib's own habits. Nothing here has a default.
conventions:
  # Names that stand where `static` or `private` do and expand to nothing
  # (a lib's `#define public`), for files read without the header that
  # defines them.
  specifier_macros: []

  # Override the class derived from a #define, for the rare macro that is
  # read wrongly: expression | empty | specifier | type | string |
  # statement | opaque.
  macros: {}

  # Names to treat as defined when choosing #ifdef branches (the
  # driver's own, such as __DGD__, are built in). Code in a branch that
  # cannot be decided is not judged.
  defines: []

  # The lib's functions that take the name of a function to call later,
  # and which argument (0-based) is what:
  #   function  the argument that names the function
  #   object    the argument that says in which object; without it the
  #             function is called in this_object()
  #   args      the first of the arguments passed on to the function;
  #             without it the number of arguments is not known
  # A function called in several ways lists its forms; a call is read by
  # the first one it fits. The driver's call_other, {object: 0,
  # function: 1, args: 2}, and call_out, {function: 0, args: 2}, are
  # built in.
  call_registry: {}
  #  subscribe: { function: 1 }                  # subscribe("event", "handler")
  #  bind:                                       # bind(obj, "fn") or bind("fn")
  #    - { object: 0, function: 1 }
  #    - { function: 0 }

  # Functions taking a literal object path, and the argument that is the
  # path; compile_object, find_object and clone_object are built in.
  object_registry: {}

  # scanf-style functions and their format-string argument; sscanf
  # (argument 1) is built in.
  format_registry: {}

  # Function or macro names whose mention marks an object as one that
  # saves itself with save_object (the static-autosave-var rule).
  autosave_markers: []

  # Lib-path globs served by virtual-object daemons (objects with no
  # backing .c file).
  virtual_paths: []

# Inputs of `dgdtools profile build`, which captures this lib as a
# profile for people who do not have all of it. They also serve linting
# the whole lib directly.
profile_build:
  name: mylib
  # The DGD driver's own config file: include_dirs, include_file,
  # auto_object, create and typechecking are read from it.
  driver_config: mud.dgd
  # The code everybody builds on. Its headers and the signatures of its
  # objects go into the profile (never function bodies), together with
  # everything it inherits or includes.
  # Shared code is found by use: any file referenced (inherit, #include,
  # call/clone/find target) from at least this many distinct owners (one
  # of the checkouts below, or another top-level directory) is shared.
  share_min_owners: 5        # the default; -1 = only what share: lists
  # Added to what inference finds. A whole directory listed here is also
  # marked complete, so a path missing under it is known not to exist.
  share: ["kernel/**", "lib/**"]
  # Never put these in a profile, even when referenced.
  omit: []
  # Where people's own trees live; lets a checkout of one of them be
  # recognized by its path.
  checkouts: ["usr/*"]

# ---------------------------------------------------------------- settings

# The formatter has one style and these three settings. Where a key is
# not set here, the file's .editorconfig is asked (indent_style,
# indent_size, end_of_line), then the default applies.
format:
  indent_style: space        # space | tab
  indent_width: 4            # spaces per level
  line_endings: preserve     # preserve | lf | crlf

lint:
  # Rules: `dgdtools rules` lists them with their defaults. A key is a
  # rule name, a code (E001), or a group (all, syntax, runtime,
  # suspicious, convention); a value is off | info | warning | error, or
  # a mapping: severity, max_per_file, and for one rule its own options
  # (`dgdtools explain RULE`). Rule beats group beats all. Giving a
  # severity turns a rule on.
  rules:
    unreachable-code: warning
    # The parts of the lib that must be inherited through path macros.
    raw-inherit-path: { severity: warning, deny: ["/lib/"] }
    # The functions that must call what they override. Default: the
    # project's create function.
    # lifecycle-chain: { names: [create, reset] }
    # syntax-error: { max_per_file: 5 }

  # Different settings for parts of the lib (globs relative to the root).
  overrides:
    - paths: ["usr/**"]
      rules: { lifecycle-chain: off }

  # Known findings to subtract (written by `dgdtools lint --write-baseline`).
  baseline: dgdtools-baseline.json

  fail_on: error             # exit 1 at this severity or above

# ------------------------------------------------------- a settings scope
#
# A dgdtools.yml below this one that says `root: false` adjusts format:
# and lint: for the files under its directory, and may hold nothing else:
#
#     # usr/name/dgdtools.yml
#     root: false
#     format: { indent_style: tab }
#     lint:
#       rules: { missing-visibility: warning }
#       overrides:
#         - paths: ["attic/**"]          # relative to this directory
#           rules: { all: off }
