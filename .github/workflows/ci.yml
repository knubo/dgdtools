name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  # Static analysis runs with the current Go release, which the current
  # staticcheck is built for; the code is checked as the Go version of
  # go.mod. Twice: as everybody builds it, and with the files only the
  # corpus tests build, which use helpers the first run must not see as
  # unused.
  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
      - run: staticcheck -tags corpus ./...
